<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Appointment Preparation Builder | The Body Ledger</title><link rel="stylesheet" href="../assets/styles.css"><script src="../assets/layout.js" defer></script><script src="../assets/site.js" defer></script><script src="../assets/body-ledger.js" defer></script></head><body data-ledger-page="builder"><main id="main"><header class="ledger-hero"><div class="ledger-shell"><p class="eyebrow">The Body Ledger</p><h1>Appointment preparation builder</h1><p class="hero-lede" style="margin-left:0;text-align:left">Choose what belongs in the conversation. The builder will organize your entries into an editable, printable summary.</p><nav class="ledger-nav" aria-label="Body Ledger navigation"><a data-ledger-page="dashboard" href="body-ledger-dashboard.html">Overview</a><a data-ledger-page="log" href="body-ledger-log.html">Log symptoms</a><a data-ledger-page="patterns" href="body-ledger-patterns.html">Patterns</a><a data-ledger-page="appointments" href="body-ledger-appointments.html">Appointments</a><a data-ledger-page="builder" href="body-ledger-builder.html">Preparation builder</a><a data-ledger-page="profile" href="body-ledger-profile.html">Profile</a></nav></div></header><section class="section compact"><div class="ledger-shell"><form id="builder-form" class="ledger-card no-print"><div class="form-grid"><label>Provider or clinic<input name="provider"></label><label>Specialty<input name="specialty"></label><label>Appointment date<input name="date" type="date"></label><label>Main reason for the visit<input name="reason" placeholder="What do you most need help understanding?"></label><label>Start of tracking period<input name="from" type="date"></label><label>End of tracking period<input name="to" type="date"></label></div><fieldset style="margin-top:1rem"><legend>Symptoms to include</legend><div id="builder-symptoms" class="option-grid"></div></fieldset><div class="form-grid" style="margin-top:1rem"><label class="full">Question one<input name="question1" placeholder="What possibilities should be considered?"></label><label class="full">Question two<input name="question2" placeholder="What evaluation or referral may be appropriate?"></label><label class="full">Question three<input name="question3" placeholder="What changes would require urgent care?"></label><label class="full">Additional notes<textarea name="notes" rows="4"></textarea></label></div><div class="ledger-actions"><button class="ledger-button" type="submit">Build my summary</button></div></form><div id="packet-actions" class="ledger-actions hidden no-print"><button id="print-packet" class="ledger-button" type="button">Print or save as PDF</button><a class="ledger-button secondary" href="body-ledger-log.html">Add another symptom</a></div><div id="packet-preview" style="margin-top:1rem" aria-live="polite"></div></div></section></main></body></html>
